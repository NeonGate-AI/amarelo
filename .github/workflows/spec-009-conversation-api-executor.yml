name: Execute SPEC-009 Conversation API

on:
  push:
    branches:
      - experiment/spec-009-first-ana-conversation-baseline
    paths:
      - .github/workflows/spec-009-conversation-api-executor.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/spec-009-first-ana-conversation-baseline
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate, validate, and commit
        shell: bash
        run: |
          set -euo pipefail
          export CI=true
          pnpm install --frozen-lockfile
          python3 .github/spec-009-conversation-api.py
          python3 <<'PY'
          import json
          from pathlib import Path

          tsconfig_path = Path('workspaces/apps/conversation-api/tsconfig.json')
          tsconfig = json.loads(tsconfig_path.read_text(encoding='utf-8'))
          tsconfig['compilerOptions']['lib'] = ['ES2022', 'DOM', 'DOM.Iterable']
          tsconfig_path.write_text(
              json.dumps(tsconfig, indent=2) + '\n',
              encoding='utf-8',
          )

          fixture_path = Path(
              'workspaces/apps/conversation-api/src/assurance/evals/'
              'conversation-api/conversation-api.fixtures.ts'
          )
          fixture = fixture_path.read_text(encoding='utf-8')
          replacements = [
              (
                  "    const url = new URL(typeof input === 'string' ? input : input.url)\n",
                  "    const inputUrl =\n"
                  "      typeof input === 'string'\n"
                  "        ? input\n"
                  "        : input instanceof URL\n"
                  "          ? input.href\n"
                  "          : input.url\n"
                  "    const url = new URL(inputUrl)\n"
                  "    const method = (init?.method ?? 'GET').toUpperCase()\n"
                  "    if (method !== 'GET' && method !== 'POST') {\n"
                  "      throw new TypeError(`Unsupported injected method: ${method}`)\n"
                  "    }\n",
              ),
              (
                  "    const response = await app.inject({\n",
                  "    const injectedResponse = await app.inject({\n",
              ),
              (
                  "      method: init?.method ?? 'GET',\n",
                  "      method,\n",
              ),
              (
                  "Object.entries(response.headers)",
                  "Object.entries(injectedResponse.headers)",
              ),
              (
                  "new Response(response.body,",
                  "new Response(injectedResponse.body,",
              ),
              (
                  "status: response.statusCode",
                  "status: injectedResponse.statusCode",
              ),
          ]
          for old, new in replacements:
              if old not in fixture:
                  raise RuntimeError(f'expected fixture source is missing: {old!r}')
              fixture = fixture.replace(old, new, 1)
          fixture_path.write_text(fixture, encoding='utf-8')
          PY
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile
          pnpm exec biome check --write workspaces/apps/conversation-api
          git rm -f .github/spec-009-conversation-api.py
          git rm -f .github/workflows/spec-009-conversation-api-executor.yml
          pnpm --filter conversation-api typecheck
          pnpm --filter conversation-api test
          pnpm --filter @repo/conversation-sdk test
          pnpm --filter @ai/ana test
          ./cli/elo check architecture
          ./cli/elo check imports
          git config user.name "Jonatas Sales"
          git config user.email "sykes.echo@proton.me"
          git add -A
          git commit -m "feat(conversation): add the Fastify Ana turn API" -m "Spec: SPEC-009"
          git push origin HEAD:experiment/spec-009-first-ana-conversation-baseline
