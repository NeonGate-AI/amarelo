name: SPEC-031 numbered rule catalog migration retry

on:
  push:
    branches:
      - governance/spec-031-numbered-rule-catalog
    paths:
      - .github/workflows/spec-031-rule-catalog-migration-retry.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/spec-031-numbered-rule-catalog
          fetch-depth: 0

      - name: Execute migration and remove temporary workflows atomically
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/spec-031-rule-catalog-migration.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          start = next(index for index, line in enumerate(lines) if line.strip() == "python3 <<'PY'")
          end = next(index for index in range(start + 1, len(lines)) if lines[index].strip() == 'PY')
          script = textwrap.dedent('\n'.join(lines[start + 1:end]))
          exec(compile(script, str(workflow), 'exec'), {'__name__': '__main__'})
          PY

          chmod 755 .audit/rules.audit.sh
          git rm -f \
            .github/workflows/spec-031-rule-catalog-migration.yml \
            .github/workflows/spec-031-rule-catalog-migration-retry.yml
          git config user.name "Jonatas Sales"
          git config user.email "sykes.echo@proton.me"
          git add -A
          git commit -m "refactor(rules): enumerate canonical catalog"
          git push origin HEAD:governance/spec-031-numbered-rule-catalog
