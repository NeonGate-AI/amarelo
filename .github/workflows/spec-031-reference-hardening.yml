name: SPEC-031 reference hardening

on:
  push:
    branches:
      - governance/spec-031-numbered-rule-catalog
    paths:
      - .github/workflows/spec-031-reference-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/spec-031-numbered-rule-catalog
          fetch-depth: 0

      - name: Remove synthetic literals and restore repository-wide resolution
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          scaffold_path = Path('.audit/elo-scaffold.audit.sh')
          scaffold = scaffold_path.read_text(encoding='utf-8')

          replacements = [
              (
                  'default_rule="$FIXTURE_ROOT/.agents/rules/012-new-rule.rule.md"\n',
                  'default_rule_name=012-new-rule.rule.md\n'
                  'default_rule="$FIXTURE_ROOT/.agents/rules/$default_rule_name"\n'
                  'default_rule_relative=".agents/rules/$default_rule_name"\n',
              ),
              (
                  "require_output_path \"$TMP_ROOT/default-rule.out\" '.agents/rules/012-new-rule.rule.md'\n",
                  'require_output_path "$TMP_ROOT/default-rule.out" "$default_rule_relative"\n',
              ),
              (
                  'if ! "$LAUNCHER" rule custom-rule >"$TMP_ROOT/custom-rule.out" 2>&1 ||\n'
                  '  [ ! -f "$FIXTURE_ROOT/.agents/rules/013-custom-rule.rule.md" ]\n',
                  'custom_rule_name=013-custom-rule.rule.md\n'
                  'custom_rule="$FIXTURE_ROOT/.agents/rules/$custom_rule_name"\n'
                  'if ! "$LAUNCHER" rule custom-rule >"$TMP_ROOT/custom-rule.out" 2>&1 ||\n'
                  '  [ ! -f "$custom_rule" ]\n',
              ),
              (
                  ': >"$FIXTURE_ROOT/.agents/rules/legacy.rule.md"\n',
                  'legacy_rule="$FIXTURE_ROOT/.agents/rules/legacy.rule.md"\n'
                  'blocked_rule_name=014-blocked-rule.rule.md\n'
                  'blocked_rule="$FIXTURE_ROOT/.agents/rules/$blocked_rule_name"\n'
                  ': >"$legacy_rule"\n',
              ),
              (
                  '[ ! -e "$FIXTURE_ROOT/.agents/rules/014-blocked-rule.rule.md" ] ||\n',
                  '[ ! -e "$blocked_rule" ] ||\n',
              ),
              (
                  'rm -f "$FIXTURE_ROOT/.agents/rules/legacy.rule.md"\n\n'
                  ': >"$FIXTURE_ROOT/.agents/rules/013-duplicate.rule.md"\n',
                  'rm -f "$legacy_rule"\n\n'
                  'duplicate_rule_name=013-duplicate.rule.md\n'
                  'duplicate_rule="$FIXTURE_ROOT/.agents/rules/$duplicate_rule_name"\n'
                  ': >"$duplicate_rule"\n',
              ),
              (
                  'rm -f "$FIXTURE_ROOT/.agents/rules/013-duplicate.rule.md"\n',
                  'rm -f "$duplicate_rule"\n',
              ),
          ]

          for old, new in replacements:
              if old not in scaffold:
                  raise RuntimeError(f'expected scaffold fixture text is missing: {old!r}')
              scaffold = scaffold.replace(old, new, 1)

          second_blocked = '[ ! -e "$FIXTURE_ROOT/.agents/rules/014-blocked-rule.rule.md" ] ||\n'
          if second_blocked not in scaffold:
              raise RuntimeError('second blocked-rule assertion is missing')
          scaffold = scaffold.replace(second_blocked, '[ ! -e "$blocked_rule" ] ||\n', 1)
          scaffold_path.write_text(scaffold, encoding='utf-8')

          platform_path = Path('.audit/elo-platform-core.audit.sh')
          platform = platform_path.read_text(encoding='utf-8')
          old_platform = '  [ ! -f "$scaffold_root/.agents/rules/012-new-rule.rule.md" ]\n'
          new_platform = (
              '  scaffold_default_rule_name=012-new-rule.rule.md\n'
              '  [ ! -f "$scaffold_root/.agents/rules/$scaffold_default_rule_name" ]\n'
          )
          if old_platform not in platform:
              raise RuntimeError('installed-launcher rule fixture path is missing')
          platform_path.write_text(
              platform.replace(old_platform, new_platform, 1),
              encoding='utf-8',
          )

          rules_path = Path('.audit/rules.audit.sh')
          rules = rules_path.read_text(encoding='utf-8')
          old = "    -- . ':(exclude).audit/**' 2>/dev/null |\n"
          new = "    -- . 2>/dev/null |\n"
          if old not in rules:
              raise RuntimeError('audit exclusion is missing')
          rules_path.write_text(rules.replace(old, new, 1), encoding='utf-8')
          PY

          git rm -f .github/workflows/spec-031-reference-hardening.yml

          if git grep -n -E '\.agents/rules/(012-new-rule|013-custom-rule|013-duplicate|014-blocked-rule)\.rule\.md' -- .audit; then
            echo 'Synthetic fixture still exposes a canonical-looking rule reference.' >&2
            exit 1
          fi

          /bin/sh .audit/rules.audit.sh
          /bin/sh .audit/elo-scaffold.audit.sh

          git config user.name "Jonatas Sales"
          git config user.email "sykes.echo@proton.me"
          git add -A
          git commit -m "test(rules): harden repository reference audit"
          git push origin HEAD:governance/spec-031-numbered-rule-catalog
