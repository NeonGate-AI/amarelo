name: SPEC-031 numbered rule catalog migration

on:
  push:
    branches:
      - governance/spec-031-numbered-rule-catalog
    paths:
      - .github/workflows/spec-031-rule-catalog-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/spec-031-numbered-rule-catalog
          fetch-depth: 0

      - name: Apply the atomic rule-catalog migration
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from __future__ import annotations

          import os
          import subprocess
          from pathlib import Path

          root = Path(".")
          rules = (
              ("001", "architecture"),
              ("002", "code-style"),
              ("003", "context-engineering"),
              ("004", "import-boundaries"),
              ("005", "markdown"),
              ("006", "memory-nucleus"),
              ("007", "package-ownership"),
              ("008", "product-safety-and-privacy"),
              ("009", "react-and-next"),
              ("010", "source-organization"),
              ("011", "spec-driven-development"),
          )

          def read(path: str) -> str:
              return (root / path).read_text(encoding="utf-8")

          def write(path: str, content: str) -> None:
              target = root / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding="utf-8")

          def replace_once(path: str, old: str, new: str) -> None:
              content = read(path)
              if old not in content:
                  raise RuntimeError(f"expected text is missing from {path}: {old!r}")
              write(path, content.replace(old, new, 1))

          for number, slug in rules:
              old_path = f".agents/rules/{slug}.rule.md"
              new_path = f".agents/rules/{number}-{slug}.rule.md"
              subprocess.run(("git", "mv", old_path, new_path), check=True)

          tracked = subprocess.check_output(("git", "ls-files", "-z")).split(b"\0")
          for raw_path in tracked:
              if not raw_path:
                  continue
              path = root / os.fsdecode(raw_path)
              if not path.is_file():
                  continue
              try:
                  content = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              updated = content
              for number, slug in rules:
                  updated = updated.replace(
                      f"{slug}.rule.md",
                      f"{number}-{slug}.rule.md",
                  )
              updated = updated.replace(
                  "all|architecture|imports|memory|platform|skills|specs",
                  "all|architecture|imports|memory|platform|rules|skills|specs",
              )
              if updated != content:
                  path.write_text(updated, encoding="utf-8")

          replace_once(
              "AGENTS.md",
              "- rules: `lowercase-kebab-case.rule.md` under `.agents/rules/`;",
              "- rules: `NNN-lowercase-kebab-case.rule.md` under `.agents/rules/`;",
          )
          replace_once(
              "AGENTS.md",
              "Context documents, skills, prompt templates and the unnumbered spec support files `readme.md`, `template.md` and `workflow.md` keep their ordinary names.",
              "Context documents, skills, prompt templates, `.agents/rules/readme.md`, and the unnumbered spec support files `readme.md`, `template.md` and `workflow.md` keep their ordinary names. Rule prefixes are stable catalog identities; frontmatter `priority` governs precedence.",
          )

          replace_once(
              ".agents/context/architecture/overview.md",
              "| Durable rule | `.agents/rules/<name>.rule.md` |",
              "| Durable rule | `.agents/rules/NNN-<name>.rule.md` |",
          )
          replace_once(
              ".agents/context/architecture/overview.md",
              "Context documents and skills remain ordinary Markdown because their directory already identifies their role.",
              "Rule numbers are stable catalog identities, not load-order or precedence values; frontmatter `priority` remains authoritative. `.agents/rules/readme.md` is the only unnumbered support document in that boundary. Context documents and skills remain ordinary Markdown because their directory already identifies their role.",
          )

          replace_once(
              ".agents/rules/005-markdown.rule.md",
              "- Durable rules under `.agents/rules/` end in `.rule.md`.",
              "- Durable rules under `.agents/rules/` use `NNN-lowercase-kebab-case.rule.md`; `readme.md` is the only unnumbered support-file exception there.",
          )
          replace_once(
              ".agents/rules/010-source-organization.rule.md",
              "Engineering artifact skeletons live only in `.agents/prompts/` and are consumed by Elo's scaffold command.",
              "Durable repository rules are direct `.agents/rules/NNN-lowercase-kebab-case.rule.md` children. Their numeric prefix is a stable catalog identity, while frontmatter `priority` controls precedence. Engineering artifact skeletons live only in `.agents/prompts/` and are consumed by Elo's scaffold command.",
          )
          spec_rule_path = ".agents/rules/011-spec-driven-development.rule.md"
          spec_rule = read(spec_rule_path)
          marker = "- Spec frontmatter and cross-references use the canonical `.rule.md`, `.adr.md` and `.spec.md` paths.\n"
          addition = (
              "- Every durable rule is a direct `.agents/rules/NNN-lowercase-kebab-case.rule.md` child; "
              "`readme.md` is the only unnumbered support document, and rule IDs are never reused or "
              "renumbered to express precedence.\n"
          )
          if addition not in spec_rule:
              if marker not in spec_rule:
                  raise RuntimeError("spec-driven rule insertion point is missing")
              spec_rule = spec_rule.replace(marker, marker + addition, 1)
              write(spec_rule_path, spec_rule)

          write(
              ".agents/rules/readme.md",
              """---
          version: 3
          name: Rules Index
          description: Stable identities, catalog, precedence, and lifecycle of durable repository rules.
          alwaysApply: true
          priority: high
          tags:
            - harness
            - rules
          ---

          # Rules

          Rules are durable constraints that implementations and engineering agents must obey. Every canonical rule is a direct child named `NNN-lowercase-kebab-case.rule.md`; this `readme.md` is the only unnumbered support document in the boundary.

          The three-digit prefix is a stable catalog identity, not enforcement order. Frontmatter `priority` governs precedence. Existing identities are never reassigned, compacted, or reused after retirement. A new rule receives one greater than the highest allocated identity and must update this index, exact references, and executable checks in the same change.

          Prefer small rules with one clear concern. When a rule can be checked mechanically, the repository harness should enforce it. Do not store temporary task instructions here. Complex architectural changes must consider an ADR, spec, contract, and mechanical invariant in the same cycle.

          ## Catalog

          | ID | Canonical rule |
          |---:|---|
          | 001 | [Architecture](001-architecture.rule.md) |
          | 002 | [Code style](002-code-style.rule.md) |
          | 003 | [Context engineering](003-context-engineering.rule.md) |
          | 004 | [Import boundaries](004-import-boundaries.rule.md) |
          | 005 | [Markdown](005-markdown.rule.md) |
          | 006 | [Memory Nucleus](006-memory-nucleus.rule.md) |
          | 007 | [Package ownership](007-package-ownership.rule.md) |
          | 008 | [Product safety and privacy](008-product-safety-and-privacy.rule.md) |
          | 009 | [React and Next.js](009-react-and-next.rule.md) |
          | 010 | [Source organization](010-source-organization.rule.md) |
          | 011 | [Spec-driven development](011-spec-driven-development.rule.md) |
          """.replace("          ", ""),
          )

          write(
              ".agents/adrs/0026-numbered-rule-catalog.adr.md",
              """# ADR 0026: Use stable numbered identities for repository rules

          ## Status

          Accepted on 2026-09-03.

          ## Context

          Amarelo's durable rules already use the semantic `.rule.md` suffix, but the eleven canonical files remain unnumbered while Elo scaffolds future rules with three-digit prefixes. The scaffold therefore has to infer occupied positions from an inconsistent catalog, and exact rule paths are repeated across specs, context, ADRs, skills, audits, and root navigation. A partial rename would break agent loading or leave stale sources of truth.

          ## Decision

          Every durable rule is a direct `.agents/rules/NNN-lowercase-kebab-case.rule.md` child. `.agents/rules/readme.md` remains the only unnumbered support document.

          Assign the initial eleven identities in lexical slug order: `001` architecture, `002` code style, `003` context engineering, `004` import boundaries, `005` Markdown, `006` Memory Nucleus, `007` package ownership, `008` product safety and privacy, `009` React and Next.js, `010` source organization, and `011` spec-driven development.

          The prefix is a stable catalog identity, not enforcement precedence. Frontmatter `priority` continues to govern precedence. New rules receive one greater than the highest allocated identity. Retired identities are not reused or compacted, and canonical path changes update every repository reference atomically without compatibility aliases.

          ## Consequences

          - Rule paths are deterministic and align with Elo-generated artifacts.
          - Agents and maintainers can cite one durable identity without interpreting filename order as precedence.
          - Renames and stale references become mechanically detectable.
          - Adding or retiring a rule requires an index and checker update in the same governed change.
          - The migration changes no existing policy meaning, applicability, or runtime behavior.
          """.replace("          ", ""),
          )

          spec_path = ".agents/specs/031-numbered-rule-catalog.spec.md"
          spec = read(spec_path)
          spec = spec.replace("status: ready", "status: in-progress", 1)
          spec = spec.replace(
              ".agents/adrs/0018-spec-driven-development.adr.md",
              ".agents/adrs/0018-spec-driven-delivery.adr.md",
          )
          if "  - .agents/adrs/0026-numbered-rule-catalog.adr.md\n" not in spec:
              spec = spec.replace(
                  "  - .agents/adrs/0025-agent-artifact-prompt-templates.adr.md\n",
                  "  - .agents/adrs/0025-agent-artifact-prompt-templates.adr.md\n"
                  "  - .agents/adrs/0026-numbered-rule-catalog.adr.md\n",
                  1,
              )
          spec = spec.replace(
              "evidence:\n  - pending\n",
              "evidence:\n  - .audit/rules.audit.sh\n  - https://github.com/NeonGate-AI/amarelo/issues/30\n",
              1,
          )
          write(spec_path, spec)

          replace_once(
              ".agents/specs/readme.md",
              "| 031 | SPEC-031 | ready |",
              "| 031 | SPEC-031 | in-progress |",
          )

          elo_path = "cli/src/elo.sh"
          elo = read(elo_path)
          elo = elo.replace(
              "      platform) elo_run_check elo-platform ;;\n"
              "      skills) elo_run_check workflow-skills ;;\n"
              "      specs) elo_run_check specs ;;\n",
              "      platform) elo_run_check elo-platform ;;\n"
              "      rules) elo_run_check rules ;;\n"
              "      skills) elo_run_check workflow-skills ;;\n"
              "      specs) elo_run_check specs ;;\n",
              1,
          )
          elo = elo.replace(
              "for elo_check in elo-platform architecture specs workflow-skills import-boundaries memory-invariants;",
              "for elo_check in elo-platform architecture rules specs workflow-skills import-boundaries memory-invariants;",
              1,
          )
          elo = elo.replace(
              "Usage: elo check <all|architecture|imports|memory|platform|skills|specs>",
              "Usage: elo check <all|architecture|imports|memory|platform|rules|skills|specs>",
              1,
          )
          write(elo_path, elo)

          if "🧪 check <all|architecture|imports|memory|platform|rules|skills|specs>" not in read("cli/src/commands/help.sh"):
              raise RuntimeError("help did not receive the rules audit command")
          replace_once(
              "cli/readme.md",
              "elo check all\n",
              "elo check rules\nelo check all\n",
          )
          replace_once(
              "cli/readme.md",
              "ADRs, rules, and specs receive their next repository number;",
              "ADRs, rules, and specs receive their next repository number; rule numbers are stable catalog identities rather than precedence;",
          )

          scaffold_path = "cli/src/commands/scaffold.sh"
          scaffold = read(scaffold_path)
          old_rule_allocator = """elo_scaffold_next_rule_prefix() {
            elo_scaffold_rule_max=0
            elo_scaffold_rule_count=0
            elo_scaffold_rule_seen=' '

            for elo_scaffold_path in "$ELO_PROJECT_ROOT"/.agents/rules/*.rule.md; do
              [ -f "$elo_scaffold_path" ] || continue
              elo_scaffold_rule_count=$((elo_scaffold_rule_count + 1))
              elo_scaffold_base=${elo_scaffold_path##*/}
              elo_scaffold_prefix=${elo_scaffold_base%%-*}
              [ "${#elo_scaffold_prefix}" -eq 3 ] || continue
              case "$elo_scaffold_prefix" in
                *[!0-9]*) continue ;;
              esac
              elo_scaffold_number=$(elo_scaffold_decimal "$elo_scaffold_prefix" 3 "Rule prefix")
              case "$elo_scaffold_rule_seen" in
                *" $elo_scaffold_number "*) elo_die "Duplicate rule prefix: $elo_scaffold_prefix" ;;
              esac
              elo_scaffold_rule_seen="$elo_scaffold_rule_seen$elo_scaffold_number "
              if [ "$elo_scaffold_number" -gt "$elo_scaffold_rule_max" ]; then
                elo_scaffold_rule_max=$elo_scaffold_number
              fi
            done

            elo_scaffold_next=$((elo_scaffold_rule_max + 1))
            if [ "$elo_scaffold_next" -le "$elo_scaffold_rule_count" ]; then
              elo_scaffold_next=$((elo_scaffold_rule_count + 1))
            fi
            [ "$elo_scaffold_next" -le 999 ] || elo_die "Three-digit rule numbering is exhausted."
            printf '%03d\n' "$elo_scaffold_next"
          }
          """.replace("          ", "")
          new_rule_allocator = """elo_scaffold_next_rule_prefix() {
            elo_scaffold_rule_max=0
            elo_scaffold_rule_seen=' '

            for elo_scaffold_path in "$ELO_PROJECT_ROOT"/.agents/rules/*.rule.md; do
              [ -f "$elo_scaffold_path" ] || continue
              elo_scaffold_base=${elo_scaffold_path##*/}
              if ! printf '%s\n' "$elo_scaffold_base" |
                grep -Eq '^[0-9][0-9][0-9]-[a-z0-9]+(-[a-z0-9]+)*\.rule\.md$'
              then
                elo_die "Cannot allocate after malformed rule filename: $(elo_rel "$elo_scaffold_path")."
              fi
              elo_scaffold_prefix=${elo_scaffold_base%%-*}
              elo_scaffold_number=$(elo_scaffold_decimal "$elo_scaffold_prefix" 3 "Rule prefix")
              case "$elo_scaffold_rule_seen" in
                *" $elo_scaffold_number "*) elo_die "Duplicate rule prefix: $elo_scaffold_prefix" ;;
              esac
              elo_scaffold_rule_seen="$elo_scaffold_rule_seen$elo_scaffold_number "
              if [ "$elo_scaffold_number" -gt "$elo_scaffold_rule_max" ]; then
                elo_scaffold_rule_max=$elo_scaffold_number
              fi
            done

            elo_scaffold_next=$((elo_scaffold_rule_max + 1))
            [ "$elo_scaffold_next" -le 999 ] || elo_die "Three-digit rule numbering is exhausted."
            printf '%03d\n' "$elo_scaffold_next"
          }
          """.replace("          ", "")
          if old_rule_allocator not in scaffold:
              raise RuntimeError("old rule allocator is missing")
          write(scaffold_path, scaffold.replace(old_rule_allocator, new_rule_allocator, 1))

          scaffold_audit_path = ".audit/elo-scaffold.audit.sh"
          scaffold_audit = read(scaffold_audit_path)
          old_fixture = """for scaffold_rule in architecture code-style context-engineering import-boundaries markdown memory-nucleus package-ownership product-safety-and-privacy react-and-next source-organization spec-driven-development; do
            : >"$FIXTURE_ROOT/.agents/rules/$scaffold_rule.rule.md"
          done
          """.replace("          ", "")
          new_fixture = """scaffold_rule_number=1
          for scaffold_rule in architecture code-style context-engineering import-boundaries markdown memory-nucleus package-ownership product-safety-and-privacy react-and-next source-organization spec-driven-development; do
            scaffold_rule_prefix=$(printf '%03d' "$scaffold_rule_number")
            : >"$FIXTURE_ROOT/.agents/rules/$scaffold_rule_prefix-$scaffold_rule.rule.md"
            scaffold_rule_number=$((scaffold_rule_number + 1))
          done
          """.replace("          ", "")
          if old_fixture not in scaffold_audit:
              raise RuntimeError("old rule fixture is missing")
          scaffold_audit = scaffold_audit.replace(old_fixture, new_fixture, 1)

          rule_test_marker = """if ! "$LAUNCHER" skill custom-skill >"$TMP_ROOT/custom-skill.out" 2>&1 ||
            [ ! -f "$FIXTURE_ROOT/.agents/skills/custom-skill/SKILL.md" ]
          then
          """.replace("          ", "")
          rule_catalog_tests = """: >"$FIXTURE_ROOT/.agents/rules/legacy.rule.md"
          "$LAUNCHER" rule blocked-rule >"$TMP_ROOT/malformed-rule.out" 2>&1
          malformed_rule_status=$?
          [ "$malformed_rule_status" -ne 0 ] ||
            scaffold_fail cli/src/commands/scaffold.sh "an unnumbered rule catalog entry must fail allocation"
          [ ! -e "$FIXTURE_ROOT/.agents/rules/014-blocked-rule.rule.md" ] ||
            scaffold_fail cli/src/commands/scaffold.sh "malformed rule allocation created a target"
          grep -F 'malformed rule filename' "$TMP_ROOT/malformed-rule.out" >/dev/null 2>&1 ||
            scaffold_fail cli/src/commands/scaffold.sh "malformed rule failure did not explain the catalog error"
          rm -f "$FIXTURE_ROOT/.agents/rules/legacy.rule.md"

          : >"$FIXTURE_ROOT/.agents/rules/013-duplicate.rule.md"
          "$LAUNCHER" rule blocked-rule >"$TMP_ROOT/duplicate-rule.out" 2>&1
          duplicate_rule_status=$?
          [ "$duplicate_rule_status" -ne 0 ] ||
            scaffold_fail cli/src/commands/scaffold.sh "a duplicate rule identity must fail allocation"
          [ ! -e "$FIXTURE_ROOT/.agents/rules/014-blocked-rule.rule.md" ] ||
            scaffold_fail cli/src/commands/scaffold.sh "duplicate rule allocation created a target"
          grep -F 'Duplicate rule prefix: 013' "$TMP_ROOT/duplicate-rule.out" >/dev/null 2>&1 ||
            scaffold_fail cli/src/commands/scaffold.sh "duplicate rule failure did not identify the prefix"
          rm -f "$FIXTURE_ROOT/.agents/rules/013-duplicate.rule.md"

          """.replace("          ", "")
          if rule_test_marker not in scaffold_audit:
              raise RuntimeError("rule catalog test insertion point is missing")
          scaffold_audit = scaffold_audit.replace(
              rule_test_marker,
              rule_catalog_tests + rule_test_marker,
              1,
          )
          scaffold_audit = scaffold_audit.replace(
              "printf 'custom slugs and argument validation: PASS\n'\n",
              "printf 'custom slugs and argument validation: PASS\n'\n"
              "printf 'numbered rule catalog failures: PASS\n'\n",
              1,
          )
          write(scaffold_audit_path, scaffold_audit)

          write(
              ".audit/rules.audit.sh",
              r"""#!/bin/sh
          set -eu

          AUDIT_DIR=$(
            CDPATH=
            cd -P "$(dirname "$0")"
            pwd
          )
          PROJECT_ROOT=${GITHUB_WORKSPACE:-$(
            CDPATH=
            cd -P "$AUDIT_DIR/.."
            pwd
          )}
          RULE_ROOT="$PROJECT_ROOT/.agents/rules"
          TMP_ROOT="${TMPDIR:-/tmp}/amarelo-rule-audit.$$"

          umask 077
          mkdir "$TMP_ROOT" || {
            printf 'Rule catalog FAIL: cannot create temporary directory\n' >&2
            exit 1
          }
          cleanup() { rm -rf "$TMP_ROOT"; }
          trap cleanup 0 1 2 15

          failures=0

          rule_fail() {
            failures=$((failures + 1))
            printf '\n[%s] %s\n  %s\n  fix: %s\n' "$1" "$2" "$3" "$4" >&2
          }

          [ -f "$RULE_ROOT/readme.md" ] ||
            rule_fail support-file .agents/rules/readme.md \
              "the canonical rule index is missing" \
              "restore the unnumbered support document"

          nested=$(find "$RULE_ROOT" -mindepth 1 -type d -print | sort)
          if [ -n "$nested" ]; then
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              rule_fail flat-catalog "${path#"$PROJECT_ROOT"/}" \
                "rule subdirectories are not allowed" \
                "move durable rules directly under .agents/rules"
            done <<EOF
          $nested
          EOF
          fi

          inventory="$TMP_ROOT/inventory"
          index_inventory="$TMP_ROOT/index-inventory"
          prefixes="$TMP_ROOT/prefixes"
          : >"$prefixes"
          find "$RULE_ROOT" -maxdepth 1 -type f -name '*.rule.md' -print |
            sort >"$inventory"

          while IFS= read -r path; do
            [ -n "$path" ] || continue
            base=${path##*/}
            if ! printf '%s\n' "$base" |
              grep -Eq '^[0-9][0-9][0-9]-[a-z0-9]+(-[a-z0-9]+)*\.rule\.md$'
            then
              rule_fail rule-filename "${path#"$PROJECT_ROOT"/}" \
                "durable rules must use NNN-lowercase-kebab-case.rule.md" \
                "rename the rule and update references atomically"
              continue
            fi

            prefix=${base%%-*}
            if grep -Fx "$prefix" "$prefixes" >/dev/null 2>&1; then
              rule_fail duplicate-rule-id "${path#"$PROJECT_ROOT"/}" \
                "rule identity $prefix is duplicated" \
                "preserve one owner and allocate a new highest identity"
            else
              printf '%s\n' "$prefix" >>"$prefixes"
            fi

            grep -Eq '^alwaysApply:[[:space:]]*(true|false)[[:space:]]*$' "$path" ||
              rule_fail rule-metadata "${path#"$PROJECT_ROOT"/}" \
                "alwaysApply must be explicit" \
                "restore canonical rule frontmatter"
            grep -Eq '^priority:[[:space:]]*[a-z][a-z-]*[[:space:]]*$' "$path" ||
              rule_fail rule-metadata "${path#"$PROJECT_ROOT"/}" \
                "priority must be explicit" \
                "restore canonical rule frontmatter"
          done <"$inventory"

          cat >"$TMP_ROOT/required" <<'CATALOG'
          001|architecture
          002|code-style
          003|context-engineering
          004|import-boundaries
          005|markdown
          006|memory-nucleus
          007|package-ownership
          008|product-safety-and-privacy
          009|react-and-next
          010|source-organization
          011|spec-driven-development
          CATALOG

          while IFS='|' read -r number slug; do
            [ -n "$number" ] || continue
            path="$RULE_ROOT/$number-$slug.rule.md"
            [ -f "$path" ] ||
              rule_fail required-rule ".agents/rules/$number-$slug.rule.md" \
                "the initial numbered catalog mapping is incomplete" \
                "restore the canonical rule at its stable identity"
          done <"$TMP_ROOT/required"

          if [ -f "$RULE_ROOT/readme.md" ]; then
            sed -n 's/.*](\([0-9][0-9][0-9]-[a-z0-9][a-z0-9-]*\.rule\.md\)).*/\1/p' \
              "$RULE_ROOT/readme.md" |
              sort >"$index_inventory"
            sed 's#^.*/##' "$inventory" | sort >"$TMP_ROOT/file-inventory"

            if ! cmp -s "$TMP_ROOT/file-inventory" "$index_inventory"; then
              rule_fail index-drift .agents/rules/readme.md \
                "the rule index and filesystem inventory differ" \
                "list every numbered rule exactly once"
            fi
            if [ "$(sort "$index_inventory" | uniq -d | wc -l | tr -d '[:space:]')" -ne 0 ]; then
              rule_fail index-duplicate .agents/rules/readme.md \
                "a numbered rule is indexed more than once" \
                "keep one catalog row per stable identity"
            fi

            for phrase in \
              'stable catalog identity' \
              'Frontmatter `priority` governs precedence' \
              'never reassigned, compacted, or reused' \
              'only unnumbered support document'
            do
              grep -F "$phrase" "$RULE_ROOT/readme.md" >/dev/null 2>&1 ||
                rule_fail lifecycle-contract .agents/rules/readme.md \
                  "missing lifecycle contract: $phrase" \
                  "restore stable identity, precedence, and non-reuse guidance"
            done
          fi

          for path in "$RULE_ROOT"/*.md; do
            [ -f "$path" ] || continue
            base=${path##*/}
            case "$base" in
              readme.md|*.rule.md) ;;
              *)
                rule_fail unexpected-rule-file "${path#"$PROJECT_ROOT"/}" \
                  "only readme.md and numbered .rule.md documents are allowed" \
                  "remove or relocate the unsupported file"
                ;;
            esac
          done

          grep -F 'NNN-lowercase-kebab-case.rule.md' "$PROJECT_ROOT/AGENTS.md" >/dev/null 2>&1 ||
            rule_fail root-navigation AGENTS.md \
              "the root harness does not document numbered rule identity" \
              "publish the canonical filename contract"
          grep -F 'NNN-lowercase-kebab-case.rule.md' \
            "$RULE_ROOT/005-markdown.rule.md" >/dev/null 2>&1 ||
            rule_fail markdown-contract .agents/rules/005-markdown.rule.md \
              "the Markdown rule does not own the numbered filename contract" \
              "restore the canonical naming rule"
          grep -F 'NNN-lowercase-kebab-case.rule.md' \
            "$RULE_ROOT/011-spec-driven-development.rule.md" >/dev/null 2>&1 ||
            rule_fail workflow-contract .agents/rules/011-spec-driven-development.rule.md \
              "the delivery rule does not require numbered rule references" \
              "restore the cross-reference contract"
          [ -f "$PROJECT_ROOT/.agents/adrs/0026-numbered-rule-catalog.adr.md" ] ||
            rule_fail architecture-decision .agents/adrs/0026-numbered-rule-catalog.adr.md \
              "the stable rule-identity decision is missing" \
              "restore ADR-0026"

          if command -v git >/dev/null 2>&1 &&
            git -C "$PROJECT_ROOT" rev-parse --is-inside-work-tree >/dev/null 2>&1
          then
            while IFS='|' read -r number slug; do
              [ -n "$number" ] || continue
              stale="$TMP_ROOT/stale-$number"
              if git -C "$PROJECT_ROOT" grep -n -E \
                "(^|[^0-9A-Za-z-])${slug}\.rule\.md([^0-9A-Za-z-]|$)" -- . \
                >"$stale" 2>/dev/null
              then
                rule_fail stale-rule-reference "$slug.rule.md" \
                  "legacy unnumbered references remain:\n$(cat "$stale")" \
                  "replace every reference with $number-$slug.rule.md"
              fi
            done <"$TMP_ROOT/required"

            git -C "$PROJECT_ROOT" grep -h -o -E \
              '\.agents/rules/[0-9][0-9][0-9]-[a-z0-9]+(-[a-z0-9]+)*\.rule\.md' \
              -- . 2>/dev/null |
              sort -u >"$TMP_ROOT/references" || :

            while IFS= read -r reference; do
              [ -n "$reference" ] || continue
              [ -f "$PROJECT_ROOT/$reference" ] ||
                rule_fail unresolved-rule-reference "$reference" \
                  "the referenced numbered rule does not exist" \
                  "repair or remove the stale reference"
            done <"$TMP_ROOT/references"
          else
            rule_fail git-required .audit/rules.audit.sh \
              "git is required to prove repository-wide reference integrity" \
              "run the audit from a repository checkout"
          fi

          if [ "$failures" -gt 0 ]; then
            printf '\nRule catalog FAIL (%s)\n' "$failures" >&2
            exit 1
          fi

          printf 'Rule catalog PASS\n'
          printf 'numbered inventory and lifecycle: PASS\n'
          printf 'index and repository references: PASS\n'
          """.replace("          ", ""),
          )
          PY

          chmod 755 .audit/rules.audit.sh
          git rm .github/workflows/spec-031-rule-catalog-migration.yml
          git config user.name "Jonatas Sales"
          git config user.email "sykes.echo@proton.me"
          git add -A
          git commit -m "refactor(rules): enumerate canonical catalog"
          git push origin HEAD:governance/spec-031-numbered-rule-catalog
