name: Execute SPEC-009 pre-Memory baseline

on:
  push:
    branches:
      - experiment/spec-009-first-ana-conversation-baseline
    paths:
      - .github/workflows/spec-009-baseline-executor.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/spec-009-first-ana-conversation-baseline
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate, validate, and commit
        shell: bash
        run: |
          set -euo pipefail
          export CI=true
          pnpm install --frozen-lockfile
          python3 .github/spec-009-baseline.py
          python3 <<'PY'
          from pathlib import Path

          path = Path(
              'workspaces/apps/conversation-api/src/assurance/evals/'
              'pre-memory-baseline/pre-memory-baseline.fixtures.ts'
          )
          content = path.read_text(encoding='utf-8')
          old = '''export const PRE_MEMORY_BASELINE_REQUEST: ConversationTurnRequest =
            Object.freeze({
              agentId: 'ana',
              asOf: PRE_MEMORY_BASELINE_GENERATED_AT,
              conversationId: 'spec-009-baseline-conversation-1',
              history: Object.freeze([]),
              message: 'Oi!',
              purpose: 'conversation.support',
              requestId: 'spec-009-baseline-request-1'
            })
          '''
          new = '''export const PRE_MEMORY_BASELINE_REQUEST: ConversationTurnRequest = {
            agentId: 'ana',
            asOf: PRE_MEMORY_BASELINE_GENERATED_AT,
            conversationId: 'spec-009-baseline-conversation-1',
            history: [],
            message: 'Oi!',
            purpose: 'conversation.support',
            requestId: 'spec-009-baseline-request-1'
          }
          '''
          if old not in content:
              raise RuntimeError('baseline request fixture source is missing')
          path.write_text(content.replace(old, new, 1), encoding='utf-8')
          PY
          pnpm --filter conversation-api exec node --import tsx src/assurance/evals/pre-memory-baseline/pre-memory-baseline.eval.ts --write
          pnpm exec biome check --write workspaces/apps/conversation-api
          git rm -f .github/spec-009-baseline.py
          git rm -f .github/workflows/spec-009-baseline-executor.yml
          pnpm --filter conversation-api typecheck
          pnpm --filter conversation-api test
          pnpm --filter conversation-api eval
          ./cli/elo check architecture
          ./cli/elo check imports
          git config user.name "Jonatas Sales"
          git config user.email "sykes.echo@proton.me"
          git add -A
          git commit -m "test(conversation): record the sanitized pre-Memory baseline" -m "Spec: SPEC-009"
          git push origin HEAD:experiment/spec-009-first-ana-conversation-baseline
