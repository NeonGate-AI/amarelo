name: Execute SPEC-009 Mobile lifecycle

on:
  push:
    branches:
      - experiment/spec-009-first-ana-conversation-baseline
    paths:
      - .github/workflows/spec-009-mobile-executor.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/spec-009-first-ana-conversation-baseline
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate, validate, and commit
        shell: bash
        run: |
          set -euo pipefail
          export CI=true
          pnpm install --frozen-lockfile
          python3 .github/spec-009-mobile.py
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile
          pnpm exec biome check --write workspaces/apps/mobile turbo.json
          git rm -f .github/spec-009-mobile.py
          git rm -f .github/workflows/spec-009-mobile-executor.yml
          pnpm --filter mobile typecheck
          pnpm --filter mobile test
          pnpm --filter mobile build
          ./cli/elo check architecture
          ./cli/elo check imports
          git config user.name "Jonatas Sales"
          git config user.email "sykes.echo@proton.me"
          git add -A
          git commit -m "feat(mobile): drive Ana through the request lifecycle" -m "Spec: SPEC-009"
          git push origin HEAD:experiment/spec-009-first-ana-conversation-baseline
