name: Handoff 3.5 Public Imports

on:
  push:
    branches:
      - refactor/handoff-02-housekeeping

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/handoff-02-housekeeping
          fetch-depth: 0

      - name: Normalize public imports
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              "@repo/react/ui/agent-orb/presets": "@repo/react/ui/agent-orb",
              "@utilities": "@repo/react/utilities",
              "@smoothui/lib": "@repo/react/vendors/smoothui/lib",
              "@smoothui/smooth-button": "@repo/react/ui/smooth-button",
          }

          roots = [Path('workspaces/apps'), Path('workspaces/packages/react/src')]
          changed = []
          for root in roots:
              for path in root.rglob('*'):
                  if path.suffix not in {'.ts', '.tsx', '.js', '.jsx'}:
                      continue
                  text = path.read_text()
                  next_text = text
                  for old, new in replacements.items():
                      next_text = next_text.replace(old, new)
                  if next_text != text:
                      path.write_text(next_text)
                      changed.append(str(path))

          print(f'Normalized {len(changed)} files')
          for path in changed:
              print(path)
          PY

          rm -f .github/workflows/handoff-3-5-public-imports.yml

      - name: Commit migration
        shell: bash
        run: |
          git diff --check
          if git diff --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workspaces .github/workflows/handoff-3-5-public-imports.yml
          git commit -m 'refactor(imports): finish shared public boundaries'
          git push origin HEAD:refactor/handoff-02-housekeeping
