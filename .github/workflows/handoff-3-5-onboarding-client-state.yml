name: Handoff 3.5 Onboarding Client State

on:
  push:
    branches:
      - refactor/handoff-02-housekeeping

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/handoff-02-housekeeping
          fetch-depth: 0

      - name: Isolate client-safe auth state
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('workspaces/apps/onboarding/src/app/lib/ui')
          changed = []
          for path in root.rglob('*.tsx'):
              text = path.read_text()
              next_text = text.replace("from '@lib/auth'", "from '@lib/auth/state'")
              if next_text != text:
                  path.write_text(next_text)
                  changed.append(str(path))

          print(f'Updated {len(changed)} client files')
          for path in changed:
              print(path)
          PY

          rm -f workspaces/apps/onboarding/src/app/api/auth/auth-state.ts
          rm -f .github/workflows/handoff-3-5-onboarding-client-state.yml

      - name: Commit migration
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workspaces/apps/onboarding .github/workflows/handoff-3-5-onboarding-client-state.yml
          git commit -m 'fix(onboarding): isolate client-safe auth state imports'
          git push origin HEAD:refactor/handoff-02-housekeeping
