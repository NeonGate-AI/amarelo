name: Fix SPEC-015 support document audit

on:
  push:
    branches:
      - governance/spec-015-memory-validation-roadmap

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Exempt allowed support documents
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.audit/specs.audit.sh')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '  case "$path" in\n    *.adr.md) ;;',
              '  case "$path" in\n    */readme.md|*/template.md|*.adr.md) ;;',
              1,
          )
          text = text.replace(
              '  case "$path" in\n    *.rule.md) ;;',
              '  case "$path" in\n    */readme.md|*.rule.md) ;;',
              1,
          )
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/fix-spec-audit-support-docs.yml').unlink()
          PY
          sh -n .audit/specs.audit.sh

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(spec-015): exempt harness support documents"
          git push origin HEAD:governance/spec-015-memory-validation-roadmap
