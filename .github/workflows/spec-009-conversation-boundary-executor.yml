name: Execute SPEC-009 Conversation boundary

on:
  push:
    branches:
      - experiment/spec-009-first-ana-conversation-baseline
    paths:
      - .github/workflows/spec-009-conversation-boundary-executor.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/spec-009-first-ana-conversation-baseline
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Migrate, validate, and commit
        shell: bash
        run: |
          set -euo pipefail
          export CI=true
          pnpm install --frozen-lockfile
          python3 .github/spec-009-conversation-boundary.py
          pnpm exec biome check --write workspaces/ai/conversation workspaces/ai/agents/ana/tsconfig.json workspaces/apps/conversation-api/tsconfig.json
          /bin/sh -n .audit/import-boundaries.audit.sh
          git rm -f .github/spec-009-conversation-boundary.py
          git rm -f .github/workflows/spec-009-conversation-boundary-executor.yml
          pnpm --filter @ai/conversation typecheck
          pnpm --filter @ai/conversation test
          pnpm --filter @ai/ana typecheck
          pnpm --filter @ai/ana test
          pnpm --filter conversation-api typecheck
          pnpm --filter conversation-api test
          ./cli/elo check architecture
          ./cli/elo check imports
          git config user.name "Jonatas Sales"
          git config user.email "sykes.echo@proton.me"
          git add -A
          git commit -m "refactor(conversation): enforce the public package boundary" -m "Spec: SPEC-009"
          git push origin HEAD:experiment/spec-009-first-ana-conversation-baseline
