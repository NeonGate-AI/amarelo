name: Reconcile harness suffix references

on:
  push:
    branches:
      - governance/spec-015-memory-validation-roadmap

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconcile semantic references and checker
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          mapping: dict[str, str] = {}

          for path in (root / '.agents/adrs').glob('*.adr.md'):
              canonical = path.as_posix()
              mapping[canonical.removesuffix('.adr.md') + '.md'] = canonical
          for path in (root / '.agents/rules').glob('*.rule.md'):
              canonical = path.as_posix()
              mapping[canonical.removesuffix('.rule.md') + '.md'] = canonical
          for path in (root / '.agents/specs').glob('*.spec.md'):
              canonical = path.as_posix()
              mapping[canonical.removesuffix('.spec.md') + '.md'] = canonical
          for path in (root / '.audit').glob('*.audit.sh'):
              canonical = path.as_posix()
              mapping[canonical.removesuffix('.audit.sh') + '.script.sh'] = canonical

          mapping.update({
              '.agents/rules/product-safety.md': '.agents/rules/product-safety-and-privacy.rule.md',
              '.agents/rules/product-safety-and-privacy.md': '.agents/rules/product-safety-and-privacy.rule.md',
              '.agents/context/apps/': '.agents/context/workflows/',
              '.agents/adrs/0011-memory-platform-and-sdk.adr.md': '.agents/adrs/0012-memory-nucleus-layout.adr.md',
              '.agents/specs/014-background-memory-curation-loop.md': '.agents/specs/025-background-memory-curation-loop.spec.md',
          })

          special_replacements = {
              '.agents/adrs/0008-cost-first-background-memory-curation.adr.md': {
                  '.agents/rules/ai-runtime.md': '.agents/rules/memory-nucleus.rule.md',
              },
              '.agents/adrs/0010-elos-and-ai-domain-workspaces.adr.md': {
                  '.agents/rules/ai-runtime.md': '.agents/rules/context-engineering.rule.md',
              },
          }

          excluded = {'.git', 'node_modules', 'dist', '.next', '.turbo', 'coverage'}
          text_suffixes = {'.md', '.sh', '.yml', '.yaml', '.json', '.ts', '.tsx', '.js', '.mjs'}
          workflow = root / '.github/workflows/reconcile-harness-suffix-references.yml'

          for path in root.rglob('*'):
              if not path.is_file() or any(part in excluded for part in path.parts):
                  continue
              if path == workflow or path.suffix not in text_suffixes:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = text
              for old, new in special_replacements.get(path.as_posix(), {}).items():
                  updated = updated.replace(old, new)
              for old, new in sorted(mapping.items(), key=lambda item: len(item[0]), reverse=True):
                  updated = updated.replace(old, new)
              updated = updated.replace(
                  '001-memory-nucleus-product-contract.spec.md through 007-plans-and-entitlements.md',
                  '001-memory-nucleus-product-contract.spec.md through 007-plans-and-entitlements.spec.md',
              )
              updated = updated.replace(
                  '| `.script` | Temporary executable audit/check script | `.audit/architecture.audit.sh` |',
                  '| `.audit` | Executable repository invariant checker | `.audit/architecture.audit.sh` |',
              )
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          audit_path = root / '.audit/specs.audit.sh'
          audit = audit_path.read_text(encoding='utf-8')
          if 'unsuffixed-adr-reference' not in audit:
              anchor = 'if [ -s "$numbers" ]; then'
              if anchor not in audit:
                  raise SystemExit('reference-audit insertion anchor not found')
              check = '''reference_files="$TMP_ROOT/semantic-reference-files"
          find "$PROJECT_ROOT" \\
            \\( -path "$PROJECT_ROOT/.git" -o -path '*/node_modules' -o \\
               -path '*/dist' -o -path '*/.next' -o -path '*/.turbo' -o \\
               -path '*/coverage' \\) -prune -o \\
            -type f \\( -name '*.md' -o -name '*.sh' -o -name '*.yml' -o \\
              -name '*.yaml' -o -name '*.json' -o -name '*.ts' -o \\
              -name '*.tsx' -o -name '*.js' -o -name '*.mjs' \\) -print | \\
            sort >"$reference_files"

          while IFS= read -r reference_file; do
            [ -n "$reference_file" ] || continue
            [ "$reference_file" != "$PROJECT_ROOT/.audit/specs.audit.sh" ] || continue

            if grep -Eq '\\.agents/adrs/[0-9][0-9][0-9][0-9]-[a-z0-9-]+\\.md([^a-zA-Z0-9.]|$)' "$reference_file"; then
              spec_fail unsuffixed-adr-reference "${reference_file#"$PROJECT_ROOT"/}" \\
                "reference points to an ADR without the canonical .adr.md suffix" \\
                "replace it with the canonical semantic-suffix path"
            fi
            if sed 's#\\.agents/rules/readme\\.md##g' "$reference_file" | \\
              grep -Eq '\\.agents/rules/[a-z0-9-]+\\.md([^a-zA-Z0-9.]|$)'; then
              spec_fail unsuffixed-rule-reference "${reference_file#"$PROJECT_ROOT"/}" \\
                "reference points to a rule without the canonical .rule.md suffix" \\
                "replace it with the canonical semantic-suffix path"
            fi
            if grep -Eq '\\.agents/specs/[0-9][0-9][0-9]-[a-z0-9-]+\\.md([^a-zA-Z0-9.]|$)' "$reference_file"; then
              spec_fail unsuffixed-spec-reference "${reference_file#"$PROJECT_ROOT"/}" \\
                "reference points to a numbered spec without the canonical .spec.md suffix" \\
                "replace it with the canonical semantic-suffix path"
            fi
            if grep -Eq '\\.audit/[a-z0-9-]+\\.script\\.sh([^a-zA-Z0-9.]|$)' "$reference_file"; then
              spec_fail legacy-audit-reference "${reference_file#"$PROJECT_ROOT"/}" \\
                "reference points to a retired .script.sh audit path" \\
                "replace it with the canonical .audit.sh path"
            fi
          done <"$reference_files"

          '''
              audit = audit.replace(anchor, check + anchor, 1)
              audit_path.write_text(audit, encoding='utf-8')

          workflow.unlink()
          PY

          sh -n .audit/specs.audit.sh
          ./cli/elo check specs

      - name: Commit reconciliation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(spec-015): reconcile semantic harness references"
          git push origin HEAD:governance/spec-015-memory-validation-roadmap
