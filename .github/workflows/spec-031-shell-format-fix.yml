name: SPEC-031 shell format cleanup

on:
  push:
    branches:
      - governance/spec-031-numbered-rule-catalog
    paths:
      - .github/workflows/spec-031-shell-format-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/spec-031-numbered-rule-catalog
          fetch-depth: 0

      - name: Normalize POSIX printf format strings
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('cli/src/commands/scaffold.sh')
          content = path.read_text(encoding='utf-8')
          replacements = {
              "printf '%s\n' \"$elo_scaffold_base\" |": "printf '%s\\n' \"$elo_scaffold_base\" |",
              "printf '%03d\n' \"$elo_scaffold_next\"": "printf '%03d\\n' \"$elo_scaffold_next\"",
          }
          for old, new in replacements.items():
              if old not in content:
                  raise RuntimeError(f'expected multiline format string is missing: {old!r}')
              content = content.replace(old, new, 1)
          path.write_text(content, encoding='utf-8')
          PY

          git rm -f .github/workflows/spec-031-shell-format-fix.yml
          git config user.name "Jonatas Sales"
          git config user.email "sykes.echo@proton.me"
          git add -A
          git commit -m "style(cli): normalize scaffold format strings"
          git push origin HEAD:governance/spec-031-numbered-rule-catalog
