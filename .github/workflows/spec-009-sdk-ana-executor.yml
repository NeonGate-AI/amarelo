name: Execute SPEC-009 SDK and Ana

on:
  push:
    branches:
      - experiment/spec-009-first-ana-conversation-baseline
    paths:
      - .github/workflows/spec-009-sdk-ana-executor.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/spec-009-first-ana-conversation-baseline
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate, validate, and commit
        shell: bash
        run: |
          set -euo pipefail
          export CI=true
          pnpm install --frozen-lockfile
          python3 .github/spec-009-sdk-ana.py
          python3 <<'PY'
          import json
          from pathlib import Path

          tsconfig_path = Path('workspaces/ai/agents/ana/tsconfig.json')
          data = json.loads(tsconfig_path.read_text(encoding='utf-8'))
          data['compilerOptions']['paths'] = {
              '@context': ['../../conversation/src/context/index.ts'],
              '@contracts': ['../../conversation/src/contracts/index.ts'],
              '@memory': ['../../conversation/src/memory/index.ts'],
              '@ports': ['../../conversation/src/ports/index.ts'],
              '@routing': ['../../conversation/src/routing/index.ts'],
              '@runtime': ['../../conversation/src/runtime/index.ts'],
          }
          tsconfig_path.write_text(
              json.dumps(data, indent=2) + '\n',
              encoding='utf-8',
          )

          fixture_path = Path(
              'workspaces/ai/agents/ana/src/assurance/evals/'
              'ana-agent/ana-agent.fixtures.ts'
          )
          fixture = fixture_path.read_text(encoding='utf-8')
          fixture = fixture.replace("from '../../../model'", "from '@ai/ana'")
          fixture_path.write_text(fixture, encoding='utf-8')

          Path(
              'workspaces/ai/agents/ana/src/assurance/evals/'
              'ana-agent/index.ts'
          ).write_text(
              "export * from './ana-agent.eval'\n"
              "export * from './ana-agent.fixtures'\n",
              encoding='utf-8',
          )
          Path(
              'workspaces/packages/conversation-sdk/src/assurance/evals/'
              'conversation-sdk/index.ts'
          ).write_text(
              "export * from './conversation-sdk.eval'\n",
              encoding='utf-8',
          )
          PY
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile
          pnpm exec biome check --write workspaces/packages/conversation-sdk workspaces/ai/agents/ana
          git rm -f .github/spec-009-sdk-ana.py
          git rm -f .github/workflows/spec-009-sdk-ana-executor.yml
          pnpm --filter @repo/conversation-sdk typecheck
          pnpm --filter @repo/conversation-sdk test
          pnpm --filter @ai/ana typecheck
          pnpm --filter @ai/ana test
          ./cli/elo check architecture
          ./cli/elo check imports
          git config user.name "Jonatas Sales"
          git config user.email "sykes.echo@proton.me"
          git add -A
          git commit -m "feat(conversation): add SDK and Ana model seam" -m "Spec: SPEC-009"
          git push origin HEAD:experiment/spec-009-first-ana-conversation-baseline
