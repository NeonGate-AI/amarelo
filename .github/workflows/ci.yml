name: CI

on:
  push:
    branches:
      - main
      - develop
      - refactor/**
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: write

env:
  NODE_VERSION: 24

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Elo doctor
        run: ./elo doctor --ci

      - name: Check architecture
        run: ./elo check architecture

      - name: Check memory invariants
        run: ./elo check memory

      - name: Audit hygiene
        shell: bash
        run: |
          tracked="$(git ls-files '.audit/**' | grep -v '^.audit/.gitkeep$' || true)"
          if [ -n "$tracked" ]; then
            echo 'Generated .audit evidence must not be committed:'
            echo "$tracked"
            exit 1
          fi

      - name: Commitlint
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            pnpm exec commitlint --from "$PR_BASE" --to "$PR_HEAD" --verbose
          else
            base="$PUSH_BEFORE"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base="$(git rev-list --max-parents=0 HEAD)"
            fi
            pnpm exec commitlint --from "$base" --to "$HEAD_SHA" --verbose
          fi

      - name: Apply Biome formatting for Handoff 2
        if: github.event_name == 'push' && github.ref == 'refs/heads/refactor/handoff-02-housekeeping'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          architecture = Path('cli/src/scripts/architecture.script.mjs')
          text = architecture.read_text()
          text = text.replace(
              "import { dirname, extname, join, relative, resolve, sep } from 'node:path'",
              "import { extname, join, relative, sep } from 'node:path'",
          )
          architecture.write_text(text)

          curation = Path('workspaces/memory-nucleus/src/application/use-cases/curate-memory.use-case.ts')
          text = curation.read_text()
          text = text.replace(
              '    let authorization\n',
              '    let authorization: Awaited<ReturnType<typeof resolveMemoryCurationAuthorization>>\n',
          )
          text = text.replace(
              '    let extraction\n',
              "    let extraction: Awaited<ReturnType<MemoryExtractor['extract']>>['extraction']\n",
          )
          curation.write_text(text)
          PY
          pnpm exec biome format --write workspaces cli
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add workspaces cli
            git commit --no-verify -m 'chore(format): apply biome formatting'
            git push
          fi

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Evaluate AI
        run: pnpm eval:ai

      - name: Build
        run: pnpm build

      - name: Git hook smoke tests
        shell: bash
        run: |
          sh .husky/pre-commit
          printf 'chore(ci): validate commit hook\n' > .audit/commit-message.txt
          sh .husky/commit-msg .audit/commit-message.txt
          rm -f .audit/commit-message.txt
