name: CI

on:
  push:
    branches:
      - main
      - develop
      - refactor/**
      - feat/**
      - fix/**
      - docs/**
      - chore/**
      - test/**
      - governance/**
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Elo doctor
        run: ./cli/elo doctor --ci

      - name: Elo audit suite
        run: ./cli/elo check all

      - name: Audit hygiene
        shell: sh
        run: |
          tracked="$(
            git ls-files '.audit/**' |
              grep -Ev '^\.audit/(\.gitkeep|[a-z0-9-]+\.audit\.sh)$' ||
              true
          )"
          if [ -n "$tracked" ]; then
            printf 'Unexpected tracked .audit evidence:\n%s\n' "$tracked"
            exit 1
          fi

      - name: Commitlint
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            pnpm exec commitlint --from "$PR_BASE" --to "$PR_HEAD" --verbose
          else
            base="$PUSH_BEFORE"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base="$(git rev-list --max-parents=0 HEAD)"
            fi
            pnpm exec commitlint --from "$base" --to "$HEAD_SHA" --verbose
          fi

      - name: Lint
        run: pnpm exec biome check workspaces cli

      - name: Typecheck
        run: pnpm exec turbo run typecheck

      - name: Test
        run: pnpm exec turbo run test

      - name: Validate Memory PostgreSQL
        run: pnpm --filter @nucleus/memory run test:database

      - name: Evaluate AI
        run: pnpm --filter @nucleus/memory --filter @repo/memory-sdk --filter @ai/knowledge --filter @ai/ana --filter conversation-api run eval

      - name: Build
        run: pnpm exec turbo run build

      - name: Git hook smoke tests
        shell: bash
        run: |
          sh .husky/pre-commit
          printf 'chore(ci): validate commit hook\n' > .audit/commit-message.txt
          sh .husky/commit-msg .audit/commit-message.txt
          rm -f .audit/commit-message.txt
