apiVersion: v1
kind: Service
metadata:
  name: landing
  labels:
    app.kubernetes.io/name: landing
    app.kubernetes.io/part-of: amarelo
spec:
  selector:
    app.kubernetes.io/name: landing
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: landing
  labels:
    app.kubernetes.io/name: landing
    app.kubernetes.io/part-of: amarelo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: landing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: landing
        app.kubernetes.io/part-of: amarelo
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      containers:
        - name: landing
          image: amarelo-dev-workspace:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: amarelo-runtime-config
            - secretRef:
                name: amarelo-runtime-environment
          command:
            - /bin/sh
            - -c
          args:
            - |
              export DATABASE_URL="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
              export REDIS_URL="redis://default:${REDIS_PASSWORD}@redis:6379/0"
              exec pnpm --filter landing dev
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
