apiVersion: v1
kind: Service
metadata:
  name: redis-queue
  labels:
    app.kubernetes.io/name: redis-queue
    app.kubernetes.io/part-of: amarelo
spec:
  selector:
    app.kubernetes.io/name: redis-queue
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-queue-data
  labels:
    app.kubernetes.io/name: redis-queue
    app.kubernetes.io/part-of: amarelo
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-queue
  labels:
    app.kubernetes.io/name: redis-queue
    app.kubernetes.io/part-of: amarelo
spec:
  serviceName: redis-queue
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-queue
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis-queue
        app.kubernetes.io/part-of: amarelo
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: redis-queue
          image: redis:8-alpine
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: amarelo-runtime-environment
          command:
            - /bin/sh
            - -c
          args:
            - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$REDIS_QUEUE_PASSWORD"
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - redis-cli --no-auth-warning -a "$REDIS_QUEUE_PASSWORD" ping | grep -q PONG
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - redis-cli --no-auth-warning -a "$REDIS_QUEUE_PASSWORD" ping | grep -q PONG
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: redis-queue-data
              mountPath: /data
      volumes:
        - name: redis-queue-data
          persistentVolumeClaim:
            claimName: redis-queue-data
